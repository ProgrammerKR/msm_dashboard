<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM Management Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef1f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 750px;
            background: white;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        h2 {
            color: #333;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        .form-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        input, select {
            width:90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: linear-gradient(135deg, #ff7eb3, #ff758c);
            color: white;
            padding: 15px;
            border-radius: 10px;
            transition: transform 0.3s;
            width: 45%;
            min-width: 140px;
            text-align: center;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .sub-card {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-weight: bold;
        }

        .sub-card div {
            padding: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            flex: 1;
            text-align: center;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .close-btn {
            background: red;
        }

        @media (max-width: 500px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 SIM Management Dashboard</h2>
        <button onclick="openForm()">➕ Add Entry</button>

        <div class="form-popup" id="formPopup">
            <h3>Add New Entry</h3>
            <input type="date" id="date">
            <select id="simType">
                <option value="JIO">JIO</option>
                <option value="Airtel">Airtel</option>
                <option value="VI">VI</option>
                <option value="BSNL">BSNL</option>
            </select>
            <select id="type">
                <option value="MNP">MNP</option>
                <option value="ACT">Activation</option>
            </select>
            <input type="number" id="value" placeholder="SIMs Count" min="1">
            <input type="text" id="description" placeholder="Enter Description">
            <button onclick="addData()">✅ Submit</button>
            <button class="close-btn" onclick="closeForm()">❌ Close</button>
        </div>

        <div class="cards">
            <div class="card" id="JIO">
                <div class="card-title">JIO</div>
                <div class="sub-card">
                    <div>MNP: <span id="JIO_MNP">0</span></div>
                    <div>ACT: <span id="JIO_ACT">0</span></div>
                </div>
            </div>
            <div class="card" id="Airtel">
                <div class="card-title">Airtel</div>
                <div class="sub-card">
                    <div>MNP: <span id="Airtel_MNP">0</span></div>
                    <div>ACT: <span id="Airtel_ACT">0</span></div>
                </div>
            </div>
            <div class="card" id="VI">
                <div class="card-title">VI</div>
                <div class="sub-card">
                    <div>MNP: <span id="VI_MNP">0</span></div>
                    <div>ACT: <span id="VI_ACT">0</span></div>
                </div>
            </div>
            <div class="card" id="BSNL">
                <div class="card-title">BSNL</div>
                <div class="sub-card">
                    <div>MNP: <span id="BSNL_MNP">0</span></div>
                    <div>ACT: <span id="BSNL_ACT">0</span></div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>SIM Type</th>
                        <th>ORN Type</th>
                        <th>SIMs Count</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        let dataList = JSON.parse(localStorage.getItem("dataList")) || [];

        function openForm() {
            document.getElementById("formPopup").style.display = "block";
        }

        function closeForm() {
            document.getElementById("formPopup").style.display = "none";
            document.getElementById("date").value = "";
            document.getElementById("value").value = "";
            document.getElementById("description").value = "";
        }
												function deleteData(index) {
    if (confirm("Are you sure you want to delete this entry?")) {
        dataList.splice(index, 1);
        localStorage.setItem("dataList", JSON.stringify(dataList));
        updateTable(); 
        updateCards(); // Delete ke baad cards bhi update honge
        alert("Data Deleted Successfully!");
    }
}


        function addData() {
            let date = document.getElementById("date").value;
            let simType = document.getElementById("simType").value;
            let type = document.getElementById("type").value;
            let value = document.getElementById("value").value;
            let description = document.getElementById("description").value.trim() || "Nil";

            if (!date || !simType || !type || !value ) {
                alert("All fields are required!");
                return;
            }

            let newData = { date, simType, type, value, description };
            dataList.push(newData);
            localStorage.setItem("dataList", JSON.stringify(dataList));
            updateTable();
            closeForm();
            alert("Data Added Successfully!");
        }

        function updateTable() {
    document.getElementById("dataTable").innerHTML = dataList.map((item, index) => {
        let formattedDate = item.date.split("-").reverse().join("-"); // Convert YYYY-MM-DD to DD-MM-YYYY
        return `
            <tr>
                <td>${formattedDate}</td>
                <td>${item.simType}</td>
                <td>${item.type}</td>
                <td>${item.value}</td>
                <td>${item.description}</td>
                <td><button onclick="deleteData(${index})" class="close-btn">🗑 Delete</button></td>
            </tr>
        `;
    }).join('');

    updateCards(); // Cards ki values ko update karega
}


		
		function updateCards() {
    // Reset all card values to zero
    document.getElementById("JIO_MNP").innerText = "0";
    document.getElementById("JIO_ACT").innerText = "0";
    document.getElementById("Airtel_MNP").innerText = "0";
    document.getElementById("Airtel_ACT").innerText = "0";
    document.getElementById("VI_MNP").innerText = "0";
    document.getElementById("VI_ACT").innerText = "0";
    document.getElementById("BSNL_MNP").innerText = "0";
    document.getElementById("BSNL_ACT").innerText = "0";

    dataList.forEach(item => {
        let cardId = `${item.simType}_${item.type}`; // Example: JIO_MNP or Airtel_ACT
        let currentValue = parseInt(document.getElementById(cardId).innerText);
        document.getElementById(cardId).innerText = currentValue + parseInt(item.value);
    });
}

    </script>

</body>
</html>
